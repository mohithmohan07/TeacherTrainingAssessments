# fly.toml app configuration file generated for teachertrainingassessments on 2026-09-22T07:49:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'teachertrainingassessments'
primary_region = 'ams'

[env]
  # The app listens on PORT; internal_port below must match this number.
  PORT = '3000'
  # Where the SQLite database and the uploaded scans are written. This has to
  # be the mount destination below, or the data sits on the machine's own disk
  # and is wiped on every deploy.
  DATA_DIR = '/data'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
