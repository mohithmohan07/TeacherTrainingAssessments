# fly.toml app configuration file generated for teachertrainingassessments on 2026-09-26T10:23:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'teachertrainingassessments'
primary_region = 'ams'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '8080'
  # Lets Node use most of the 10 GB below, so a school's answer PDFs can be
  # matched and marked all at once. Keep it about 2 GB under the memory there.
  NODE_OPTIONS = '--max-old-space-size=8192'

[[mounts]]
  source = 'assessments_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Fly does not stop the app: it stops itself once nobody has used it for 10
  # minutes and nothing is running in the background (server/idle.js), so it
  # is paid for only while it runs, and Fly starts it again on the next visit.
  # Fly's own stopping goes by web traffic alone, so it could cut off matching
  # or marking left running after the page was closed.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

# The app exits with code 0 when it stops itself, and that must not start it
# again; a crash still does.
[[restart]]
  policy = 'on-failure'

# 10 GB, so a school's answer PDFs can be matched at once. A shared CPU takes
# up to 2 GB each, so 10 GB needs 8 of them. Fly applies this on every deploy,
# over anything set with `fly scale`.
[[vm]]
  size = 'shared-cpu-8x'
  memory = '10gb'
